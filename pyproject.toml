[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "airgap-datahub"
version = "0.2.0"
description = "Local-first data governance & PII lineage auditor for DataHub. Nothing leaves your machine."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Zeliha Ilgın Güven" }]
keywords = ["datahub", "governance", "pii", "lineage", "compliance", "gdpr", "kvkk", "ollama", "local-first", "data-catalog"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "requests>=2.28",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/zelihaguven/airgap"
Source = "https://github.com/zelihaguven/airgap"
Documentation = "https://github.com/zelihaguven/airgap/blob/main/docs/DOCUMENTATION.md"
Issues = "https://github.com/zelihaguven/airgap/issues"
Changelog = "https://github.com/zelihaguven/airgap/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Local, Docker-free real DataHub instance (DuckDB-backed). Since
# acryl-datahub 1.7.0.14 the datahub-lite extra no longer pulls in DuckDB;
# it comes from the separate duckdb extra.
datahub-lite = ["acryl-datahub[datahub-lite,duckdb]>=1.6.0"]
dev = ["pytest>=7.0", "jsonschema>=4.0", "ruff>=0.17,<0.18"]

[project.scripts]
airgap = "airgap.cli:main"

[tool.setuptools.packages.find]
include = ["airgap*"]

[tool.setuptools.package-data]
# Default config and the synthetic demo catalog, so a pip-installed
# `airgap audit` works out of the box.
"airgap.data" = ["config.yaml", "acme_datalake.json"]

[tool.ruff]
# Matches the existing code: no line is longer than 110 characters.
line-length = 110
target-version = "py310"
# examples/patches/*.py are sample outputs of `airgap audit`, kept as generated.
extend-exclude = ["examples"]

[tool.ruff.lint]
# pycodestyle errors, Pyflakes and import sorting.
select = ["E", "F", "I"]
